[tool.ruff]
# Allow lines to be as long as 200 characters.
line-length = 200

target-version = "py310"

# Vendored verbatim from the CPython 3.12 stdlib (telnetlib was removed in
# 3.13); keep it byte-identical to upstream rather than linting it.
extend-exclude = ["py_portfolio_index/portfolio_providers/helpers/telnetlib.py"]

[tool.ruff.lint.per-file-ignores]
# Broker SDKs and their HTTP transports raise arbitrary exception types, so the
# provider boundary catches broadly and either re-raises a domain error
# (PriceFetchError, ConfigurationError) or degrades deliberately.
"py_portfolio_index/portfolio_providers/**" = ["BLE001"]
